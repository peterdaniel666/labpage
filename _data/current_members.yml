- name: Yihan Wu
  photo: YihanWu.jpg
  current_position: Principal Investigator
  education:
    - "PhD: Princeton University, 2013-2018"
    - "Bachelor: Nanjing University, 2009-2013"
  email: yihanw(AT)nju(dot)edu(dot)cn
  bio: Yihan Wu is affiliated with the School of Life Sciences and the Chemistry and Biomedicine Innovation Center at Nanjing University. His lab works on microbe-associated bioactive peptides and metabolites, including those produced by microorganisms as well as those they encounter during interactions with their environment. The lab integrates synthetic biology, chemical biology, advanced metabolomics, and AI to uncover novel metabolites and pathways, while leveraging AI-driven design and engineered microbes to accelerate the development of innovative therapeutics. Yihan received a PhD in Chemistry from Princeton University, and was a Senior Scientist at WuXi Biologics.

- name: Kai Jin
  photo: KaiJin.jpg
  current_position: PhD student 
  bio: My research bridges synthetic biology and microbial functional molecules. I engineer bacteria as programmable living therapeutics that can sense the tumor microenvironment and produce therapeutic molecules directly at the tumor site. I am interested in developing synthetic biological systems that integrate multiple treatment modalities, such as phototherapy and immunotherapy, to make cancer therapies more precise and effective. I also study bioactive molecules associated with microbes to uncover their biological functions and identify new opportunities for therapeutic development. Outside the lab, I enjoy playing badminton, going for a jog, and exploring new places.

- name: Yi Huang
  photo: YiHuang.jpg
  current_position: Master student
  bio: I love drawing, reading novels, and traveling. I'm a huge fan of Lay Zhang, and I dream of becoming someone as cool and inspiring as him. I'm currently working on discovering new bioactive peptides and using genetically engineered microbes to biosynthesize antimicrobial peptides. I hope to develop live bacterial drugs and make them cheaper and more accessible than those produced through traditional chemical synthesis.

- name: Lin Hu
  photo: LinHu.jpg
  current_position: Master student
  bio: My research focuses on developing engineered microbes into smart live therapeutics. I build genetic circuits into these bacteria so that they can sense disease signals in the body and release therapeutic molecules only when and where they are needed. Outside the lab, I like to unwind by going for a jog. I also enjoy playing video games with friends—especially the teamwork and coordination when we fight side by side in battles.

- name: Zeyu Sun
  photo: ZeyuSun.jpg
  current_position: Master student
  bio: My research focuses on harnessing living bacteria as targeted delivery vehicles for antimicrobial peptides. By engineering these bacteria to carry therapeutic peptides directly to infection sites, I aim to improve treatment efficacy and overcome some of the limitations of conventional antimicrobial therapies. Outside the lab, I enjoy running and strength training. Staying active helps me recharge, maintain my energy, and approach my work with a clear and focused mind.